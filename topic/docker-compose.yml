services:
  web:
    build: .
    container_name: pdf-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=false
      - JAVA_HOST=host.docker.internal
      - JAVA_PORT=1100
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./pdf:/app/pdf
      - ./excel:/app/excel
      - ./questions:/app/questions
      - ./static:/app/static
      - ./templates:/app/templates
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"