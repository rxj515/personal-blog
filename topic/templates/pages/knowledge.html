<div class="knowledge-page">

    <!-- 页面标题 -->
    <div class="page-header">
        <div>
            <h1>📚 法规知识库</h1>
            <p>法规、规章及安全知识统一管理</p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-primary" id="update-knowledge-btn">更新知识库</button>
            <button class="btn-tag" id="tag-articles-btn">🏷️ 打标签</button>
            <button class="btn-upload" id="show-upload-btn">📤 上传PDF</button>
        </div>
    </div>

    <!-- ======================================== -->
    <!-- PDF 上传和选择区域 -->
    <!-- ======================================== -->
    <div class="pdf-manager-card">

        <!-- 当前使用的 PDF -->
        <div class="pdf-current">
            <span class="label">📄 当前使用：</span>
            <span id="current-pdf-name" class="pdf-name">未选择</span>
            <button class="btn-sm btn-switch" id="switch-pdf-btn">切换</button>
        </div>

        <!-- PDF 列表和上传 -->
        <div class="pdf-controls">

            <!-- 上传区域 -->
            <div class="pdf-upload-area" id="pdfUploadArea">
                <div class="upload-dropzone" id="dropZone">
                    <span class="upload-icon">📤</span>
                    <p>拖拽 PDF 文件到这里，或点击选择</p>
                    <input type="file" id="pdfFileInput" accept=".pdf" multiple style="display:none;">
                    <button class="btn-sm btn-upload" onclick="document.getElementById('pdfFileInput').click()">选择文件</button>
                </div>
                <div id="uploadProgress" style="display:none; margin-top: 10px;">
                    <div style="width:100%;height:6px;background:#e9ecef;border-radius:4px;overflow:hidden;">
                        <div id="progressFill" style="width:0%;height:100%;background:#007bff;border-radius:4px;transition:width 0.3s;"></div>
                    </div>
                    <span id="uploadStatus" style="font-size:12px;color:#666;">上传中...</span>
                </div>
            </div>

            <!-- PDF 列表 -->
            <div class="pdf-list-container">
                <div class="pdf-list-header">
                    <span>📁 已上传的 PDF</span>
                    <button class="btn-sm btn-refresh" onclick="loadPDFList()">🔄</button>
                </div>
                <div id="pdfList" class="pdf-list">
                    <div class="empty-state" style="padding:20px;text-align:center;color:#999;">暂无 PDF 文件</div>
                </div>
            </div>

        </div>

    </div>

    <!-- ======================================== -->
    <!-- 工具区域 -->
    <!-- ======================================== -->
    <div class="knowledge-tools">

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="knowledge-search" placeholder="搜索法规条文，例如：瓦斯、防爆、安全检查">
        </div>

        <div class="filter-box">
            <span>📖</span>
            <select id="knowledge-filter">
                <option value="">全部章节</option>
            </select>
        </div>

    </div>

    <!-- ======================================== -->
    <!-- 知识库主体 -->
    <!-- ======================================== -->
    <div class="knowledge-card">

        <div class="card-title">
            <div>法规知识内容</div>
            <span class="count-badge" id="knowledge-count">0 条</span>
        </div>

        <div class="knowledge-result-info" id="knowledge-result-info">
            共 0 条法规内容
        </div>

        <div id="knowledge-list" class="knowledge-list">
            <div class="empty-state">正在加载知识库...</div>
        </div>

        <div class="knowledge-pagination">
            <button type="button" class="btn-secondary" id="knowledge-prev">上一页</button>
            <span id="knowledge-page-info">1 / 1</span>
            <button type="button" class="btn-secondary" id="knowledge-next">下一页</button>
        </div>

    </div>

        <!-- 🏷️ 打标签进度浮层 -->
        <div id="tagProgressOverlay" class="task-progress-overlay" data-theme="tag" style="display:none;">
            <div class="task-progress-card" id="tagProgressCard">
                <div class="task-progress-title">
                    <span><span class="task-title-icon">🏷️</span>正在打标签</span>
                    <button class="task-progress-close" id="tagProgressClose" style="display:none;">×</button>
                </div>
                <div class="task-progress-bar-wrap">
                    <div class="task-progress-bar" id="tagProgressBar" style="width:0%;"></div>
                </div>
                <div class="task-progress-info">
                    <span class="task-progress-percent" id="tagProgressPercent">0%</span>
                    <span id="tagProgressCount">0 / 0</span>
                </div>
                <div class="task-progress-message" id="tagProgressMessage">准备中...</div>
            </div>
        </div>
    
        <!-- 🔄 更新知识库进度浮层 -->
        <div id="updateProgressOverlay" class="task-progress-overlay" data-theme="update" style="display:none;">
            <div class="task-progress-card" id="updateProgressCard">
                <div class="task-progress-title">
                    <span><span class="task-title-icon">🔄</span>正在更新知识库</span>
                    <button class="task-progress-close" id="updateProgressClose" style="display:none;">×</button>
                </div>
                <div class="task-progress-bar-wrap">
                    <div class="task-progress-bar" id="updateProgressBar" style="width:0%;"></div>
                </div>
                <div class="task-progress-info">
                    <span class="task-progress-percent" id="updateProgressPercent">0%</span>
                    <span id="updateProgressCount">0 / 0</span>
                </div>
                <div class="task-progress-message" id="updateProgressMessage">准备中...</div>
            </div>
        </div>

</div>
