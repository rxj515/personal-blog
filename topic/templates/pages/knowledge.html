<div class="knowledge-page">


    <!-- 页面标题 -->
    <div class="page-header">

        <div>

            <h1>
                📚 法规知识库
            </h1>

            <p>
                法规、规章及安全知识统一管理
            </p>

        </div>


        <button
            class="btn-primary"
            id="update-knowledge-btn"
        >

            更新知识库

        </button>


    </div>




    <!-- 工具区域 -->

    <div class="knowledge-tools">


        <!-- 搜索 -->

        <div class="search-box">


            <span class="search-icon">
                🔍
            </span>


            <input

                type="text"

                id="knowledge-search"

                placeholder="搜索法规条文，例如：瓦斯、防爆、安全检查"

            >


        </div>




        <!-- 分类 -->

        <div class="filter-box">


            <span>
                📖
            </span>


            <select

                id="knowledge-filter"

            >

                <option value="">
                    全部章节
                </option>


            </select>


        </div>



    </div>






    <!-- 知识库主体 -->

    <div class="knowledge-card">



        <!-- 标题 -->


        <div class="card-title">


            <div>

                法规知识内容


            </div>


            <span

                class="count-badge"

                id="knowledge-count"

            >

                0 条

            </span>



        </div>





        <!-- 信息 -->


        <div

            class="knowledge-result-info"

            id="knowledge-result-info"

        >

            共 0 条法规内容


        </div>





        <!-- 列表 -->


        <div

            id="knowledge-list"

            class="knowledge-list"

        >


            <div class="empty-state">

                正在加载知识库...

            </div>


        </div>







        <!-- 分页 -->


        <div class="knowledge-pagination">


            <button

                type="button"

                class="btn-secondary"

                id="knowledge-prev"

            >

                上一页

            </button>




            <span id="knowledge-page-info">

                1 / 1

            </span>




            <button

                type="button"

                class="btn-secondary"

                id="knowledge-next"

            >

                下一页

            </button>



        </div>



    </div>



</div>
